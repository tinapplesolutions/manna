<!doctype html>
<html lang="en" data-theme="modern">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Manna</title>
<meta name="description" content="Daily readings, the complete Catholic Bible and the Rosary.">
<meta name="theme-color" content="#FBFAF7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#FBFAF7; --surface:#FFFFFF; --surface-2:#F3F1EC; --ink:#1D1B18; --ink-2:#5E5950; --ink-3:#8E887D;
  --line:#E7E3DA; --accent:#A8741A; --accent-ink:#FFFFFF; --accent-soft:#F6ECD9;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  --scripture:"Noto Serif",Georgia,"Times New Roman",serif;
  --read-size:19px; --radius:16px; --nav-h:64px;
}
[data-theme="classic"]{
  --bg:#F5EEDC; --surface:#FBF6E9; --surface-2:#EFE5CC; --ink:#2B2117; --ink-2:#5C4A35; --ink-3:#8A7558;
  --line:#E2D4B4; --accent:#8C5A12; --accent-ink:#FFF8EA; --accent-soft:#EBDDBA;
  --ui:"Noto Serif",Georgia,serif;
}
[data-theme="dark"]{
  --bg:#121110; --surface:#1C1A18; --surface-2:#262320; --ink:#EDE8DF; --ink-2:#B5AEA2; --ink-3:#857E73;
  --line:#2F2B27; --accent:#D9A84E; --accent-ink:#1A1408; --accent-soft:#3A2F1C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--ui);overscroll-behavior-y:contain}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:var(--ink)}
.hidden{display:none!important}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;display:flex;align-items:center;gap:12px;border-bottom:1px solid transparent}
header.top.scrolled{border-bottom-color:var(--line)}
header.top h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.2px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:active{background:var(--surface-2)}
.iconbtn svg{width:24px;height:24px}
main{padding:4px 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px);max-width:720px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--ink-3)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-selected="true"]{color:var(--accent);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.daytitle{font-size:21px;font-weight:700;line-height:1.3;margin:6px 0 4px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:999px;padding:4px 10px;margin:4px 6px 0 0}
.dot{width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.block{width:100%}
.reading h3{margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.reading .ref{font-size:18px;font-weight:700;margin:2px 0 6px}
.reading .sum{color:var(--ink-2);margin:0}
.response{font-family:var(--scripture);font-style:italic;color:var(--ink);background:var(--accent-soft);border-radius:10px;padding:8px 12px;margin:8px 0 0}
.scripture{font-family:var(--scripture);font-size:var(--read-size);line-height:1.7}
.scripture p{margin:0 0 .6em}
.vn{font-family:var(--ui);font-size:.6em;font-weight:700;color:var(--accent);vertical-align:super;margin-right:3px}
.reflection{font-family:var(--scripture);font-size:17px;line-height:1.65;margin:8px 0}
.prayer{font-family:var(--scripture);font-style:italic;font-size:17px;color:var(--accent);margin:8px 0 0}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.note{background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin:12px 0;font-size:14px}
/* Mass mode */
.massview{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding:calc(env(safe-area-inset-top) + 8px) 18px calc(env(safe-area-inset-bottom) + 40px)}
.massview .bar{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:8px;padding:6px 0;z-index:2}
.massview .bar .title{flex:1;font-weight:700;font-size:15px;color:var(--ink-2)}
.massview section{max-width:720px;margin:0 auto 28px}
.massview h2{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:18px 0 2px}
.massview .ref{font-weight:700;font-size:18px;margin:0 0 10px}
.massview .scripture{font-size:calc(var(--read-size) + 3px)}
/* Bible */
.pickrow{display:flex;gap:8px;margin:4px 0 8px}
.pickrow .btn{flex:1;justify-content:space-between}
.chapnav{display:flex;gap:8px;margin:20px 0 8px}
.chapnav .btn{flex:1}
.booklist h4{margin:16px 0 6px;color:var(--ink-3);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.grid button{height:48px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-weight:600}
.grid button.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.blist{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.blist button{min-height:46px;text-align:left;padding:8px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:15px}
.blist button.cur{border-color:var(--accent);color:var(--accent);font-weight:700}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);display:flex;align-items:flex-end}
.sheet .panel{background:var(--bg);width:100%;max-height:86vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:8px 16px calc(env(safe-area-inset-bottom) + 20px)}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 10px}
.sheet .panel h3{margin:4px 0 8px}
/* Search */
.searchbox{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 4px 4px 14px;margin:8px 0}
.searchbox input{flex:1;border:0;outline:0;background:transparent;font-size:16px;min-height:44px;min-width:0}
.result{display:block;width:100%;text-align:left;padding:12px 2px;border-bottom:1px solid var(--line)}
.result b{display:block;font-size:14px;color:var(--accent);margin-bottom:2px}
.result span{font-family:var(--scripture);font-size:16px}
.result mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 2px}
.progress{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;margin:8px 0}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
/* Rosary */
.mystery{font-size:20px;font-weight:700;margin:4px 0}
.beads{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.beads i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);display:block}
.beads i.on{background:var(--accent)}
.prayertext{font-family:var(--scripture);font-size:var(--read-size);line-height:1.7;white-space:pre-line}
.stepnav{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 8px);display:flex;gap:8px;margin-top:16px}
.stepnav .btn{flex:1}
.mlist li{margin:6px 0}
/* Settings */
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;min-height:42px;border-radius:9px;font-weight:600;color:var(--ink-2);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
[data-theme="dark"] .seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.setrow{margin:18px 0}
.setrow label{display:block;font-weight:700;margin-bottom:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;max-width:90vw}
.spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:24px auto}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top" id="top">
  <h1 id="title">Manna</h1>
  <button class="iconbtn" id="settingsBtn" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>
<main id="view"></main>
<nav class="tabs" role="tablist">
  <button role="tab" data-tab="today" aria-selected="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
  <button role="tab" data-tab="bible" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/><path d="M12 6v6M9 8.5h6"/></svg>Bible</button>
  <button role="tab" data-tab="search" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search</button>
  <button role="tab" data-tab="rosary" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4.5"/><path d="M12 11.5V16M9.5 18.5h5M12 16v6"/></svg>Rosary</button>
</nav>
<script src="app.js"></script>
</body>
</html>
