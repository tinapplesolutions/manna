<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manna voice test</title>
<style>
:root{--bg:#FBFAF7;--ink:#1D1B18;--ink2:#5E5950;--line:#E7E3DA;--accent:#A8741A;--soft:#F6ECD9}
@media (prefers-color-scheme:dark){:root{--bg:#121110;--ink:#EDE8DF;--ink2:#B5AEA2;--line:#2F2B27;--accent:#D9A84E;--soft:#3A2F1C}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:20px 16px 40px;max-width:560px;margin:auto}
h1{font-size:22px;margin:0 0 4px}p{color:var(--ink2)}
.box{border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0}
select,button,input{font:inherit}
select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button{width:100%;min-height:48px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;margin-top:10px}
button.ghost{background:var(--soft);color:var(--ink)}
.verse{font-family:Georgia,serif;font-size:18px;color:var(--ink)}
#info{font-size:14px}
</style></head><body>
<h1>Manna · voice test</h1>
<p>This checks which voices your phone has for the Read aloud feature. Nothing is installed or saved.</p>
<div class="box"><div class="verse" id="verse">The Lord is my shepherd; there is nothing I shall want. In green pastures he gives me repose. Near restful waters he leads me, to revive my drooping spirit.</div></div>
<div class="box">
  <label for="voice"><b>Voice</b></label>
  <select id="voice"></select>
  <label for="rate" style="display:block;margin-top:12px"><b>Speed</b> <span id="rv">1.0×</span></label>
  <input id="rate" type="range" min="0.6" max="1.4" step="0.1" value="1" style="width:100%">
  <button id="play">▶ Read aloud</button>
  <button id="stop" class="ghost">■ Stop</button>
</div>
<p id="info">Looking for voices…</p>
<script>
const sel = document.getElementById('voice'), info = document.getElementById('info');
let voices = [];
function load() {
  if (!('speechSynthesis' in window)) { info.textContent = '✗ This browser has no Read aloud support.'; return; }
  voices = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
  if (!voices.length) return;
  sel.innerHTML = voices.map((v, i) => `<option value="${i}">${v.name} (${v.lang})${v.localService ? ' · works offline' : ' · needs internet'}</option>`).join('');
  const off = voices.filter(v => v.localService).length;
  info.textContent = `✓ Found ${voices.length} English voice${voices.length > 1 ? 's' : ''} on this phone (${off} work without internet). Tap Read aloud to hear one.`;
}
load(); if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = load;
setTimeout(() => { if (!voices.length && 'speechSynthesis' in window) info.textContent = 'No voice list yet. Tap Read aloud anyway — the phone may use its default voice.'; }, 3000);
document.getElementById('rate').oninput = e => document.getElementById('rv').textContent = (+e.target.value).toFixed(1) + '×';
document.getElementById('play').onclick = () => {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(document.getElementById('verse').textContent);
  if (voices[sel.value]) { u.voice = voices[sel.value]; u.lang = voices[sel.value].lang; }
  u.rate = +document.getElementById('rate').value;
  u.onstart = () => info.textContent = '🔊 Speaking…';
  u.onend = () => info.textContent = '✓ Done. Did it sound OK? Try other voices too.';
  u.onerror = e => info.textContent = '✗ Could not speak: ' + e.error;
  speechSynthesis.speak(u);
};
document.getElementById('stop').onclick = () => speechSynthesis.cancel();
</script>
</body></html>
